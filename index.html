<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- Добавлена иконка вкладки, чтобы не было ошибки 404 в консоли браузера -->
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
<title>Управление клиентами и льготами</title>
<style>
body {
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background-color: #f4f7f6;
color: #333;
margin: 0;
padding: 20px;
display: flex;
justify-content: center;
}

.container {
width: 100%;
max-width: 700px;
background: #fff;
border-radius: 10px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
overflow: hidden;
}

.section {
padding: 20px;
border-bottom: 1px solid #eee;
}
.section-title {
font-size: 16px;
font-weight: 600;
margin-bottom: 15px;
color: #2c3e50;
}

.form-grid {
display: grid;
grid-template-columns: 120px 1fr;
gap: 12px;
align-items: center;
}
.form-grid label {
text-align: right;
font-weight: 500;
}
.form-grid input {
padding: 8px 12px;
border: 1px solid #ccc;
border-radius: 5px;
font-size: 14px;
outline: none;
transition: border-color 0.2s;
}
.form-grid input:focus {
border-color: #3498db;
}
.btn-add {
grid-column: 1 / -1;
margin-top: 10px;
padding: 10px;
background-color: #3498db;
color: white;
border: none;
border-radius: 5px;
font-size: 14px;
font-weight: 600;
cursor: pointer;
transition: background-color 0.2s;
}
.btn-add:hover {
background-color: #2980b9;
}

.controls {
display: flex;
align-items: center;
gap: 10px;
flex-wrap: wrap;
}
.btn {
padding: 6px 12px;
background-color: #ecf0f1;
color: #2c3e50;
border: 1px solid #bdc3c7;
border-radius: 4px;
cursor: pointer;
font-size: 13px;
transition: all 0.2s;
}
.btn:hover {
background-color: #bdc3c7;
}
.count-label {
font-weight: bold;
font-size: 15px;
margin-left: 5px;
}
.separator {
width: 1px;
height: 24px;
background-color: #ccc;
margin: 0 5px;
}

.table-container {
padding: 20px;
}
table {
width: 100%;
border-collapse: collapse;
margin-top: 10px;
}
th, td {
padding: 12px 15px;
text-align: left;
border-bottom: 1px solid #eee;
}
th {
background-color: #f8f9fa;
font-weight: 600;
color: #2c3e50;
}

/* Выравнивание колонок */
th:nth-child(1), td:nth-child(1) { text-align: left; }
th:nth-child(2), td:nth-child(2) { text-align: center; }
th:nth-child(3), td:nth-child(3) { text-align: right; }
th:nth-child(4), td:nth-child(4) { text-align: center; }

tr:hover {
background-color: #f1f8ff;
}
.empty-msg {
text-align: center;
color: #888;
padding: 20px;
font-style: italic;
}
</style>
</head>
<body>

<div class="container">
<!-- Фрейм для ввода данных -->
<div class="section">
<div class="section-title">Добавление клиента</div>
<div class="form-grid">
<label for="name">Имя:</label>
<input type="text" id="name" placeholder="Введите имя">

<label for="lgota1">Льгота 1:</label>
<input type="text" id="lgota1" placeholder="Введите значение (число)">

<label for="lgota2">Льгота 2:</label>
<input type="text" id="lgota2" placeholder="Например: 1500.50">

<label for="lgota3">Льгота 3:</label>
<input type="text" id="lgota3" placeholder="Введите значение (число)">

<button class="btn-add" onclick="addClient()">Добавить клиента</button>
</div>
</div>

<!-- Фрейм для управления -->
<div class="section">
<div class="section-title">Управление</div>
<div class="controls">
<button class="btn" onclick="updateCount()">Посчитать клиентов</button>
<span class="count-label" id="countLabel">Всего: 0</span>

<div class="separator"></div>

<button class="btn" onclick="sortClients('lgota1')">Сорт. по Льготе 1</button>
<button class="btn" onclick="sortClients('lgota2')">Сорт. по Льготе 2</button>
<button class="btn" onclick="sortClients('lgota3')">Сорт. по Льготе 3</button>
</div>
</div>

<!-- Фрейм для таблицы -->
<div class="table-container">
<table>
<thead>
<tr>
<th>Имя</th>
<th>Льгота 1</th>
<th>Льгота 2</th>
<th>Льгота 3</th>
</tr>
</thead>
<tbody id="tableBody">
<!-- Строки добавляются через JavaScript -->
</tbody>
</table>
<div id="emptyMsg" class="empty-msg">Список клиентов пуст</div>
</div>
</div>

<script>
// Список клиентов
let clients = [];

// Получение элементов формы
const nameInput = document.getElementById('name');
const lgota1Input = document.getElementById('lgota1');
const lgota2Input = document.getElementById('lgota2');
const lgota3Input = document.getElementById('lgota3');

const tableBody = document.getElementById('tableBody');
const countLabel = document.getElementById('countLabel');
const emptyMsg = document.getElementById('emptyMsg');

function addClient() {
let name = nameInput.value.trim();
let lgota1Str = lgota1Input.value.trim();
let lgota2Str = lgota2Input.value.trim();
let lgota3Str = lgota3Input.value.trim();

// Валидация: Имя
if (!name) {
alert("Ошибка ввода: Поле 'Имя' не может быть пустым.");
return;
}

// Валидация: Льготы (проверяем, что введены числа)
let lgota1 = parseFloat(lgota1Str);
if (isNaN(lgota1)) {
alert("Ошибка ввода: Льгота 1 должна быть числом.");
return;
}

let lgota2 = parseFloat(lgota2Str);
if (isNaN(lgota2)) {
alert("Ошибка ввода: Льгота 2 должна быть числом.");
return;
}

let lgota3 = parseFloat(lgota3Str);
if (isNaN(lgota3)) {
alert("Ошибка ввода: Льгота 3 должна быть числом.");
return;
}

// Создание объекта клиента
let newClient = {
name: name,
lgota1: lgota1,
lgota2: lgota2,
lgota3: lgota3
};

clients.push(newClient);

// Очистка полей
nameInput.value = '';
lgota1Input.value = '';
lgota2Input.value = '';
lgota3Input.value = '';
nameInput.focus();

renderTable();
}

// ИСПРАВЛЕНО: добавлена недостающая обратная кавычка (`) в начале строки
function updateCount() {
countLabel.textContent = `Всего: ${clients.length}`;
}

function sortClients(attribute) {
// Сортировка (строки по алфавиту, числа по порядку)
clients.sort((a, b) => {
if (typeof a[attribute] === 'string') {
return a[attribute].localeCompare(b[attribute]);
}
return a[attribute] - b[attribute];
});
renderTable();
}

function renderTable() {
tableBody.innerHTML = '';

if (clients.length === 0) {
emptyMsg.style.display = 'block';
} else {
emptyMsg.style.display = 'none';
}

// ИСПРАВЛЕНО: заменены HTML-сущности на нормальные теги, добавлен $, добавлена недостающая Льгота 1
for (let client of clients) {
let row = document.createElement('tr');

// Форматируем числа до 2 знаков после запятой
row.innerHTML = `
<td>${client.name}</td>
<td>${client.lgota1.toFixed(2)}</td>
<td>${client.lgota2.toFixed(2)}</td>
<td>${client.lgota3.toFixed(2)}</td>
`;
tableBody.appendChild(row);
}

updateCount();
}

// Первичная отрисовка
renderTable();
</script>

</body>
</html>
